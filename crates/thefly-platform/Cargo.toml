[package]
name = "thefly-platform"
version = "0.1.0"
description = "SDL3 platform layer for The Fly: window, loop, assets, audio, input, text"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustysynth = "1.3"
sdl3 = { version = "0.20", features = ["build-from-source-static", "ttf"] }
thefly-assets = { path = "../thefly-assets" }
